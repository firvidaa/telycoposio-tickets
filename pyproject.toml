[project]
name = "telycoposio-tickets"
version = "0.1.0"
description = "Sistema interno de gestion de tickets de atencion al cliente para Telycoposio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Telycoposio" },
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",

    # Configuracion
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",

    # Anthropic
    "anthropic>=0.39.0",

    # Google APIs (Gmail + Sheets)
    "google-api-python-client>=2.149.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "gspread>=6.1.4",

    # Seguridad
    "bcrypt>=4.2.0",

    # Utilidades
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",

    # Zonas horarias IANA en Windows.
    # En Linux/macOS, `zoneinfo` lee de /usr/share/zoneinfo, asi que no hace
    # falta nada. En Windows no existe esa base de datos, asi que hay que
    # instalarla via PyPI o `zoneinfo.ZoneInfo("Europe/Madrid")` revienta con
    # ZoneInfoNotFoundError. La usamos en app/services/ticket_service.py para
    # calcular el anyo del contador en hora local de Madrid.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Por defecto excluimos los tests marcados ``real_api`` (tiran contra la API
# real de Anthropic, cuestan dinero y son lentos). Para ejecutarlos
# manualmente: ``pytest -m real_api``.
addopts = "-m 'not real_api'"
markers = [
    "real_api: tests que tiran contra la API real de Anthropic (cuestan dinero, lentos)",
]
