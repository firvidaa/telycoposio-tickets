{% extends "base.html" %}
{% block title %}Tickets · Telycoposio{% endblock %}
{% block layout %}
<header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-6 py-3 flex items-center justify-between">
        <div class="font-semibold">Telycoposio Tickets</div>
        <div class="flex items-center gap-3 text-sm">
            <span class="text-slate-600">{{ user.display_name }}</span>
            <form method="post" action="/logout">
                <button type="submit"
                    class="rounded-md border border-slate-300 px-3 py-1 hover:bg-slate-100 transition">
                    Cerrar sesion
                </button>
            </form>
        </div>
    </div>
</header>
<main class="max-w-5xl mx-auto px-6 py-10">
    <h1 class="text-2xl font-semibold mb-2">Tickets</h1>
    <p class="text-slate-600">El listado y el detalle llegan en el Paso 5b.</p>
</main>
{% endblock %}
