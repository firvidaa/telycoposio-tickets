{% extends "base.html" %}
{% block title %}{{ title }} · Telycoposio{% endblock %}
{% block layout %}
<main class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-2xl shadow p-8 border border-slate-200 text-center">
        <div class="text-5xl font-semibold text-slate-300 mb-2">404</div>
        <h1 class="text-xl font-semibold mb-2">{{ title }}</h1>
        <p class="text-sm text-slate-500 mb-6">{{ message }}</p>
        <a href="/tickets"
           class="inline-block rounded-lg bg-slate-900 text-white px-4 py-2 text-sm font-medium hover:bg-slate-800 transition">
            &larr; Volver al listado
        </a>
    </div>
</main>
{% endblock %}
